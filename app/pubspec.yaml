  # 兼容当前 Flutter iOS Registrar API（避免 url_launcher_ios 6.4.x 的 viewController 编译错误）
  url_launcher_ios: 6.3.2
  # 兼容当前 Flutter iOS Registrar API（避免 video_player_avfoundation 的 viewController 编译错误）
  video_player_avfoundation: 2.8.10
  opus_flutter_ios:
    git:
      url: https://github.com/mdmohsin7/opus_flutter.git
      path: opus_flutter_ios
      ref: dev
  opus_flutter_android:
    git:
      url: https://github.com/mdmohsin7/opus_flutter.git
      path: opus_flutter_android
  intercom_flutter:
    hosted:
      name: intercom_flutter
      url: https://pub.dev

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  envied_generator: ^1.3.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path_android: "assets/images/mp_app_icon_0124.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/3x/
