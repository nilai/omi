  dotted_border: ^2.1.0
  skeletonizer: 2.0.1
  shimmer: ^3.0.0
  pull_down_button: ^0.10.2

  # Localizations
  flutter_localizations:
    sdk: flutter

  # Utils
  collection: ^1.19.1
  ffi: ^2.1.0  # FFI for opus decoding
  flutter_blue_plus: 1.33.6
  flutter_blue_plus_windows: 1.24.21
  flutter_reactive_ble: ^5.4.0  # Note device BLE communication
