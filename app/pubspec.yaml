  flutter:
    sdk: flutter

  #state
  flutter_bloc: ^9.1.1
  

  #ui
  auto_size_text: 3.0.0
  lottie: ^3.1.2
  expandable_text: ^2.3.0
  flutter_native_splash: ^2.4.0
  gradient_borders: ^1.0.1
  visibility_detector: ^0.4.0+2
